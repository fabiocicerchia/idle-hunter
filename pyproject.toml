[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idle-hunter"
version = "0.1.0"
description = "Zombie-resource scanner with a confidence-to-delete score"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[project.scripts]
idle-hunter = "idle_hunter:main"

[tool.setuptools]
py-modules = ["idle_hunter"]

[tool.ruff]
line-length = 100
