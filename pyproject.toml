[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idle-hunter"
version = "0.1.0"
description = "Zombie-resource scanner with a confidence-to-delete score"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["boto3>=1.34"]

[project.scripts]
idle-hunter = "idle_hunter:main"

[tool.setuptools]
py-modules = ["idle_hunter"]
packages = ["idle_hunter_lib"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# Without this the suite imports whatever `idle_hunter` is on sys.path — in a
# bare checkout that is nothing, and `make test` fails at collection.
pythonpath = ["."]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
  "ANN002",   # a fake's *args exist to swallow whatever the real call passes
  "ANN003",   # ditto **kwargs
  "ANN201",   # a fake's return value is whatever the code under test reads
  "ANN202",
  "ANN204",
  "N803",     # the boto3 fakes mirror AWS's own PascalCase parameter names,
              # which are the API's spelling and not this project's to change
]

[tool.basedpyright]
# FC-PY-003 asks for strict. The point of a type checker in CI is that it knows
# the types: "unknown" is the finding, not a level of detail to relax away.
typeCheckingMode = "strict"
# Matches requires-python, so the checker rejects what the oldest supported
# interpreter would reject rather than what this machine happens to run.
pythonVersion = "3.10"
# Third-party stubs are not this repository's to ship, and a missing one is a
# packaging fact about someone else's project rather than a defect here.
reportMissingTypeStubs = false

# The man page rides along in the wheel: `pip install` puts it under
# <prefix>/share/man/man1, which is on the default manpath for a system install
# and for a --user one alike.
[tool.setuptools.data-files]
"share/man/man1" = ["man/idle-hunter.1"]
