[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idle-hunter"
version = "0.1.0"
description = "Zombie-resource scanner with a confidence-to-delete score"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["boto3>=1.34"]

[project.scripts]
idle-hunter = "idle_hunter:main"

[tool.setuptools]
py-modules = ["idle_hunter"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Without this the suite imports whatever `idle_hunter` is on sys.path — in a
# bare checkout that is nothing, and `make test` fails at collection.
pythonpath = ["."]
