site_name: idle-hunter
site_description: >-
  AWS zombie resources scored by how safe they are to delete, with the
  monthly cost you would reclaim. It prints commands; it never deletes.
repo_url: https://github.com/fabiocicerchia/idle-hunter
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
