version: 2
updates:
  # Keep the pinned action SHAs in the workflows fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Everything else rides in one pull request rather than one each.
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
